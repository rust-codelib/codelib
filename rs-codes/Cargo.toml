[package]
name = "rs-codes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Коды Рида–Соломона над GF(2^m): конвейер encode/decode, скелет с замороженными контрактами, no_std, без аллокаций"
keywords = ["reed-solomon", "error-correction", "fec", "galois", "no_std"]
categories = ["encoding", "no-std", "algorithms", "mathematics"]

[dependencies]
gf2m = { path = "../gf2m", version = "1.0.0" }

[lib]
name = "rs_codes"
path = "src/lib.rs"
