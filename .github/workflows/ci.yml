name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - name: Fountain examples and independent vectors
        run: |
          for example in systematic_symbols decode_with_losses repair_one_symbol repair_alternative_group decode_with_log experiment; do
            cargo run -p fountain-codes --example "$example"
          done
          python3 tools/fountain_spec_vectors.py --check
          node tools/check_fountain_spec.mjs

  test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --release

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build --release --target thumbv7em-none-eabihf -p coding-core -p gf2m -p gfpm -p rs-codes --lib
      - run: cargo build --release --target thumbv7em-none-eabihf -p coding-core --example buffers

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.81.0
      - run: cargo check --workspace --lib
      - run: cargo test -p coding-core
      - run: cargo build -p coding-core --example buffers
      - run: cargo test -p fountain-codes
      - name: Fountain examples on MSRV
        run: |
          for example in systematic_symbols decode_with_losses repair_one_symbol repair_alternative_group decode_with_log experiment; do
            cargo run -p fountain-codes --example "$example"
          done

  contracts:
    # Заморозка контрактов: приёмочные тесты РС обязаны собираться
    # уже сейчас (без запуска). Контрактные stubs_* выполняются
    # в job test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p rs-codes --test reed_solomon --no-run
